<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hizmet Değerlendirmesi</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <!-- Güvenlik & Google Rozeti -->
        <div class="google-badge">
            <svg class="google-icon" viewBox="0 0 24 24" width="18" height="18">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <span>Google Değerlendirme Sistemi</span>
        </div>

        <!-- İşletme Kartı -->
        <div class="card">
            <!-- İşletme Logo / Google İkon Alanı -->
            <div class="brand-avatar" id="brand-avatar-container">
                <svg viewBox="0 0 24 24" width="38" height="38">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
            </div>

            <h1 id="brand-name" class="brand-title">İşletme Adı</h1>
            <p class="sub-title">Deneyiminizi değerlendirmek için lütfen bir yıldız seçin</p>

            <!-- Yıldız Derecelendirme Alanı -->
            <div class="stars-container" id="stars-wrapper">
                <button class="star-btn" data-value="1" aria-label="1 Yıldız">★</button>
                <button class="star-btn" data-value="2" aria-label="2 Yıldız">★</button>
                <button class="star-btn" data-value="3" aria-label="3 Yıldız">★</button>
                <button class="star-btn" data-value="4" aria-label="4 Yıldız">★</button>
                <button class="star-btn" data-value="5" aria-label="5 Yıldız">★</button>
            </div>

            <!-- Onay Buton Alanı (Yıldız seçildiğinde görünür) -->
            <div id="submit-wrapper" class="submit-wrapper hidden">
                <button id="submit-rating-btn" class="btn-submit-rating">
                    <span id="selected-star-count">5</span> Yıldız İle Gönder
                </button>
            </div>

            <p id="feedback-hint" class="hint-text">Yıldızlara dokunun</p>
        </div>
    </main>

    <!-- 1 Yıldız Kriz Önleme Modalı -->
    <div id="crisis-modal" class="modal-backdrop hidden">
        <div class="modal-card">
            <div class="modal-header">
                <h2>Deneyiminizi Telafi Etmek İstiyoruz</h2>
                <p>Yaşadığınız aksaklığı işletme sahibine doğrudan iletin, hemen ilgilenelim.</p>
            </div>
            
            <form id="crisis-form">
                <div class="form-group">
                    <textarea id="crisis-message" rows="4" placeholder="Lütfen yaşadığınız sorunu kısaca açıklayın..." required></textarea>
                </div>
                
                <button type="submit" class="btn-primary">
                    İşletme Sahibine İlet (WhatsApp)
                </button>
                <button type="button" id="close-modal-btn" class="btn-secondary">Kapat</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
